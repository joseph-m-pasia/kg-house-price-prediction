name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Select the version increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: house-price-prediction-api

jobs:

  # --------------------------------------------------
  # 1. Determine the next version
  # --------------------------------------------------
  version:
    name: Determine Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Get latest version
        id: latest
        run: |
          TAG=$(git tag --list "v*" --sort=-version:refname | head -n 1)

          if [ -z "$TAG" ]; then
            TAG="v0.0.0"
          fi

          echo "Latest version: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: version
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          VERSION="${LATEST_TAG#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$VERSION_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;

            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;

            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"


  # --------------------------------------------------
  # 2. Create Git tag
  # --------------------------------------------------
  tag:
    name: Create Git Tag
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether tag already exists
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "ERROR: Tag $VERSION already exists."
            exit 1
          fi

      - name: Create tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$VERSION"
          git push origin "$VERSION"


  # --------------------------------------------------
  # 3. Create GitHub Release
  # --------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs:
      - version
      - tag
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --generate-notes


  # --------------------------------------------------
  # 4. Build and push Docker image to GHCR
  # --------------------------------------------------
  docker:
    name: Build and Push Docker Image
    needs:
      - version
      - tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.version }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image name
        id: image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"

          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker build \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            .

      - name: Push versioned Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker push "$IMAGE:$VERSION"

      - name: Push latest Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker push "$IMAGE:latest"